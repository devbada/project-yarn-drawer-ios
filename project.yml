name: YarnDrawer
# Xcode에서 관리하는 Team/Supported Destinations 값을 유지해야 한다.
# 이 파일로 YarnDrawer.xcodeproj를 재생성하지 않는다.
options:
  bundleIdPrefix: com.example
  developmentLanguage: ko
  knownRegions:
    - Base
    - en
    - ko
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  YarnDrawer:
    type: application
    platform: iOS
    sources:
      - path: YarnDrawer
    settings:
      base:
        DEVELOPMENT_TEAM: W96LW7FRSD
        PRODUCT_BUNDLE_IDENTIFIER: com.minam.YarnDrawer
        PRODUCT_NAME: YarnDrawer
        PRODUCT_MODULE_NAME: YarnDrawer
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 뜨개서랍
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - YarnDrawerTests

  YarnDrawerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YarnDrawerTests
    dependencies:
      - target: YarnDrawer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.YarnDrawerTests
        GENERATE_INFOPLIST_FILE: YES
